name: EAS iOS Simulator Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm matching EAS version (9.15.9)
        # EAS macOS builder has pnpm 9.15.9 pre-installed.
        # We regenerate the lockfile with the same pnpm version so patch hashes match.
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Regenerate lockfile with pnpm 9.15.9 to match EAS
        run: |
          pnpm install --no-frozen-lockfile
          if ! git diff --quiet pnpm-lock.yaml; then
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add pnpm-lock.yaml
            git commit -m "chore: update lockfile to pnpm 9.15.9 hashes for EAS [skip ci]"
            git push
            echo "Lockfile updated and pushed"
          else
            echo "Lockfile unchanged"
          fi

      - name: Setup pnpm for EAS CLI
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS Simulator
        run: eas build --platform ios --profile simulator --non-interactive
        env:
          EXPO_PUBLIC_PROJECT_ID: 361b27c1-4d2d-4a5f-b231-00456d27d148
