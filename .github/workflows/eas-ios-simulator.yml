name: EAS iOS Simulator Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Regenerate lockfile to fix patch hashes
        # EAS macOS uses pnpm 9.x which computes different patch hashes.
        # We update the lockfile here on Linux so EAS receives matching hashes.
        run: |
          pnpm install --no-frozen-lockfile
          if ! git diff --quiet pnpm-lock.yaml; then
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add pnpm-lock.yaml
            git commit -m "chore: update lockfile patch hashes for EAS build [skip ci]"
            git push
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS Simulator
        run: eas build --platform ios --profile simulator --non-interactive
        env:
          EXPO_PUBLIC_PROJECT_ID: 361b27c1-4d2d-4a5f-b231-00456d27d148
